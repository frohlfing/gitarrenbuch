<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#272b34">
<title>Gitarrenbuch</title>
<link rel="icon" href="favicon.svg?4" type="image/svg+xml">
<link rel="stylesheet" href="app.css?v=20261028b">
</head>
<body>

<div id="libraryView">
  <header>
    <div class="eyebrow">Gitarre &amp; Gesang</div>
    <h1>Das Gitarrenbuch</h1>
    <p class="sub" id="subCount">wird geladen &hellip;</p>
  </header>

  <div class="controls">
    <input type="search" id="search" placeholder="Titel, Interpret oder Genre &hellip;" aria-label="Titel, Interpret oder Genre suchen">
    <select id="tagSel" aria-label="Nach Genre filtern"><option value="">Alle Genres</option></select>
    <select id="trackSel" aria-label="Nach Spur filtern"><option value="">Alle Spuren</option></select>
    <select id="sortSel" aria-label="Sortierung">
      <option value="title">Titel</option>
      <option value="artist">Interpret</option>
      <option value="updated-desc">Zuletzt geändert</option>
      <option value="created-desc">Zuletzt angelegt</option>
    </select>
    <button class="btn btn-primary" id="newSongBtn" type="button">+ Neuer Song</button>
  </div>
  <p class="count" id="resultCount"></p>

  <div class="grid" id="songList"></div>
</div>

<main id="songView" hidden></main>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<script>
// Startdiagnose: Scheitert ein ES-Modul (Laden oder Verknüpfen), läuft app.js gar nicht und kann nichts melden.
// Dann steht hier statt "wird geladen …" der Fehler bzw. nach 10 s, welche Skripte mit welchem Status kamen.
{
  const sub = document.getElementById('subCount');
  const loading = () => sub.textContent.startsWith('wird geladen');
  addEventListener('error', e => {
    if(!loading()) return;
    sub.textContent = `Start fehlgeschlagen: ${e.message || `Datei nicht geladen ${e.target?.src}`}`;
  }, true);
  setTimeout(() => {
    if(!loading()) return;
    const files = performance.getEntriesByType('resource')
      .filter(r => /\.(m?js|php)/.test(r.name))
      .map(r => `${r.name.replace(location.origin, '')} ${r.responseStatus || '?'}`);
    sub.textContent = `Start hängt. Geladen: ${files.join(', ') || 'nichts'}`;
  }, 10000);
}
</script>
<!-- Versionszähler (?v=…): Bei jedem Hochladen mit geänderten Dateien hier überall erhöhen, damit Browser keine alten
     Fassungen aus dem Cache nehmen. Die Import-Map hängt ihn an die Module unter js/, ohne die import-Zeilen zu ändern. -->
<script type="importmap">
{
  "imports": {
    "./js/api.js": "./js/api.js?v=20261028b",
    "./js/library.js": "./js/library.js?v=20261028b",
    "./js/mixer.js": "./js/mixer.js?v=20261028b",
    "./js/player.js": "./js/player.js?v=20261028b",
    "./js/score.js": "./js/score.js?v=20261028b"
  }
}
</script>
<script type="module" src="app.js?v=20261028b"></script>
</body>
</html>
