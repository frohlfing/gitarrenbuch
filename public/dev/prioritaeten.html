<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Prioritäten der Griffe (Test)</title>
    <!--
      Vergleicht die Griffe, die der Akkord-Dialog vorschlägt, mit und ohne Akkord-Katalog - Hilfsmittel; gehört nicht zur
      Anwendung.
    -->
    <style>
        :root {
            --first: #c62828;
            --order: #e08a00;
            --line: #ccc;
            --bg: #f6f6f6;
        }

        body {
            font: 15px/1.4 system-ui, sans-serif;
            margin: 0;
            color: #222;
            background: #fff;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 2;
            background: #fff;
            border-bottom: 1px solid var(--line);
            padding: .5rem 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: .4rem 1rem;
            align-items: center;
        }

        h1 {
            font-size: 1.15rem;
            margin: 0;
        }

        main {
            padding: 1rem;
        }

        button, input {
            font: inherit;
        }

        button {
            cursor: pointer;
            border: 1px solid #999;
            background: #fff;
            border-radius: 6px;
            padding: .2rem .6rem;
        }

        button:hover {
            background: var(--bg);
        }

        #chords {
            display: flex;
            flex-wrap: wrap;
            gap: .3rem;
            margin: 0 0 1rem;
        }

        #chords button.first {
            border: 3px solid var(--first);
        }

        #chords button.order {
            border: 3px solid var(--order);
        }

        #chords button.current {
            background: #222;
            color: #fff;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: .4rem 1.2rem;
            font-size: .85rem;
            color: #444;
            margin-bottom: .8rem;
        }

        .legend i {
            display: inline-block;
            width: .9rem;
            height: .9rem;
            border: 3px solid var(--line);
            border-radius: 3px;
            vertical-align: middle;
            margin-right: .3rem;
        }

        #cols {
            display: grid;
            grid-template-columns:repeat(2, minmax(0, 1fr));
            gap: 1rem;
            align-items: start;
        }

        @media (max-width: 760px) {
            #cols {
                grid-template-columns:1fr;
            }
        }

        .col {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: .6rem;
        }

        .col h2 {
            font-size: 1rem;
            margin: 0 0 .1rem;
        }

        .col p {
            margin: 0 0 .5rem;
            font-size: .82rem;
            color: #555;
        }

        .grips {
            display: flex;
            flex-wrap: wrap;
            gap: .3rem;
        }

        .grip {
            border: 3px solid var(--line);
            border-radius: 6px;
            padding: .1rem;
            text-align: center;
            font: 600 .72rem ui-monospace, monospace;
            width: 5.6rem;
        }

        .grip svg {
            display: block;
            height: 5.5rem;
            width: auto;
            margin: 0 auto;
        }

        .grip.first {
            border-color: var(--first);
            background: #fdeeee;
        }

        .grip.order {
            border-color: var(--order);
            background: #fff5e5;
        }

        .grip small {
            display: block;
            font: 500 .66rem system-ui, sans-serif;
            color: #555;
            min-height: 1em;
        }
    </style>
</head>
<body>
<header>
    <h1>Griffe mit und ohne Katalog</h1>
    <label><input id="onlyDiff" type="checkbox"> nur Akkorde mit Unterschied</label>
    <span id="summary"></span>
</header>
<main>
    <div id="chords"></div>
    <div class="legend">
        <span><i style="border-color:var(--first)"></i>anderer erster Griff (den trägt der Dialog ins Feld ein)</span>
        <span><i style="border-color:var(--order)"></i>gleicher erster Griff, aber andere Griffe oder Reihenfolge</span>
        <span>Unter dem Griff: Stelle, Priorität (findGrips()) bzw. "Katalog", Schläge in allen Songs.</span>
    </div>
    <div id="cols"></div>
</main>
<script type="module">
    import {chordDiagramSvg} from '../js/ui/chorddiagram.js';
    import {escapeHtml} from '../js/lib/format.js';
    import {findGrips} from '../js/lib/chordgrips.js';

    /** So viele Griffbilder passen im Akkord-Dialog in eine Reihe (GRIPS_PER_ROW in dialogs/chord.js). */
    const PER_ROW = 6;

    const byId = id => document.getElementById(id);
    /** @type {Object<string, [string, number][]>} Akkord-Katalog: Name (klein) → [Griff, Schläge], häufigster zuerst */
    const data = await (await fetch('../api/chords.php')).json();
    /** @type {Object<string, string[]>} Name (klein) → Griffe */
    const catalog = Object.fromEntries(Object.entries(data).map(([k, pairs]) => [k, pairs.map(p => p[0])]));
    /** @type {Object<string, Object<string, number>>} Name (klein) → Griff → Schläge */
    const usage = Object.fromEntries(Object.entries(data).map(([k, pairs]) => [k, Object.fromEntries(pairs)]));

    /**
     * Akkordname zum Anzeigen (wie in dialogs/chordcatalog.js).
     * @param {string} key Schlüssel des Katalogs, z. B. "f#m"
     * @returns {string} z. B. "F#m"
     */
    const displayName = key => key.replace(/^[a-h]|\/[a-h]/g, s => s.toUpperCase());

    /**
     * Griffe in der Reihenfolge des Akkord-Dialogs (candidates() in dialogs/chord.js): mit Katalog erst dessen Griffe, dann
     * Priorität 1 und 2, aufgefüllt auf eine Reihe, höchstens vier Reihen.
     * @param {string} key Name (klein)
     * @param {boolean} withCatalog Katalog einbeziehen
     * @returns {{grip: string, label: string}[]}
     */
    function candidates(key, withCatalog) {
        const found = findGrips(displayName(key), {all: true});
        const priority = new Map(found.map(g => [g.grip, g.priority]));
        const list = [...new Set([...(withCatalog ? catalog[key] : []), ...found.filter(g => g.priority <= 2).map(g => g.grip)])];
        for (const g of found) {
            if (list.length >= PER_ROW) break;
            if (!list.includes(g.grip)) list.push(g.grip);
        }
        return list.slice(0, 4 * PER_ROW).map(grip => ({
            grip,
            label: priority.has(grip) ? `Prio ${priority.get(grip)}` : 'Katalog',
        }));
    }

    /** Vergleich je Akkord: "first", "order" oder "" (gleich). */
    const rows = Object.keys(catalog).map(key => {
        const a = candidates(key, true).map(c => c.grip);
        const b = candidates(key, false).map(c => c.grip);
        const diff = a[0] !== b[0] ? 'first' : a.join() !== b.join() ? 'order' : '';
        return {key, diff};
    });
    let current = rows.find(r => r.diff)?.key ?? rows[0]?.key;

    /** Zeichnet die Knöpfe der Akkorde. */
    function renderButtons() {
        const only = byId('onlyDiff').checked;
        byId('chords').innerHTML = rows.filter(r => !only || r.diff).map(r =>
            `<button data-name="${escapeHtml(r.key)}" class="${r.diff}${r.key === current ? ' current' : ''}">${escapeHtml(displayName(r.key))}</button>`).join('');
        const first = rows.filter(r => r.diff === 'first').length;
        const order = rows.filter(r => r.diff === 'order').length;
        byId('summary').textContent = `${rows.length} Akkorde im Katalog: ${first} mit anderem ersten Griff, ${order} nur mit anderer Reihenfolge`;
    }

    /** Zeigt beide Spalten für den gewählten Akkord. */
    function show() {
        renderButtons();
        if (!current) return;
        const name = displayName(current);
        const lists = [candidates(current, true), candidates(current, false)];
        const card = (c, i, other) => {
            const cls = i === 0 && other[0]?.grip !== c.grip ? 'first' : other[i]?.grip !== c.grip ? 'order' : '';
            const beats = usage[current]?.[c.grip] ?? 0;
            return `<div class="grip ${cls}">${chordDiagramSvg(name, c.grip)}${escapeHtml(c.grip)}<small>${i + 1}. · ${c.label}${beats ? ` · ${beats}×` : ''}</small></div>`;
        };
        const titles = [
            ['Mit Katalog', 'Erst die Griffe aus den Songs (häufigster zuerst), dann die berechneten. Den Griff des aktuellen Songs, der im Dialog davor steht, gibt es hier nicht.'],
            ['Ohne Katalog', 'Nur berechnet (findGrips()): Priorität 1 und 2, aufgefüllt aus 3 und 4.'],
        ];
        byId('cols').innerHTML = lists.map((list, k) => `<section class="col"><h2>${titles[k][0]}</h2><p>${titles[k][1]}</p>
    <div class="grips">${list.map((c, i) => card(c, i, lists[1 - k])).join('')}</div></section>`).join('');
    }

    byId('chords').addEventListener('click', e => {
        const b = e.target.closest('[data-name]');
        if (!b) return;
        current = b.dataset.name;
        show();
    });
    byId('onlyDiff').addEventListener('change', renderButtons);
    show();
</script>
</body>
</html>
